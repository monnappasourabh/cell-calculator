<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cell & Gastruloid Calculator</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:720px;margin:auto;padding:18px;background:#f5f7fb;color:#18212f}h1{font-size:26px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}button{padding:12px 4px;border:1px solid #ccc;border-radius:10px;background:white;font-weight:600}button.on{background:#18212f;color:white}.card{background:white;padding:16px;border-radius:15px;border:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px}input{display:block;width:100%;box-sizing:border-box;padding:11px;margin-top:4px;border:1px solid #ccc;border-radius:9px;font-size:16px}.out{background:#f1f3f5;padding:15px;border-radius:12px;margin-top:15px;line-height:1.6}.big{font-size:21px;font-weight:700}.hide{display:none}@media(max-width:500px){.grid{grid-template-columns:1fr}.tabs button{font-size:12px}}</style></head><body><h1>Cell & Gastruloid Calculator</h1><p>Seeding, freezing stocks, and gastruloid master mixes.</p><div class="tabs"><button class="tab on" data-x="seed">Seeding</button><button class="tab" data-x="freeze">Stocks</button><button class="tab" data-x="gas">Gastruloids</button></div>
<section id="seed" class="card"><div class="grid"><label>Concentration (×10⁶ cells/mL)<input id="sc" type="number" step=".001" value="8.46"></label><label>Cells/well<input id="st" type="number" value="200000"></label><label>Wells<input id="sw" type="number" value="6"></label><label>Final volume/well (mL)<input id="sv" type="number" step=".1" value="2"></label><label>Starting stock volume (mL)<input id="ss" type="number" step=".01" value="1"></label></div><div id="so" class="out"></div></section>
<section id="freeze" class="card hide"><div class="grid"><label>Cells available (millions)<input id="fc" type="number" step=".01" value="7.26"></label><label>Cells/vial (millions)<input id="fp" type="number" step=".1" value="1"></label><label>Cell aliquot/vial (µL)<input id="fa" type="number" value="250"></label><label>Freezing medium/vial (µL)<input id="fm" type="number" value="250"></label></div><div id="fo" class="out"></div></section>
<section id="gas" class="card hide"><div class="grid"><label>Concentration (×10⁶ cells/mL)<input id="gc" type="number" step=".001" value="0.398"></label><label>Cells/gastruloid<input id="gt" type="number" value="150"></label><label>Wells<input id="gw" type="number" value="96"></label><label>Volume/well (µL)<input id="gv" type="number" value="40"></label><label>Master mix (mL)<input id="gm" type="number" step=".1" value="5"></label></div><div id="go" class="out"></div></section>
<script>const $=x=>document.getElementById(x),n=x=>Number($(x).value),f=(x,d=2)=>x.toLocaleString(undefined,{maximumFractionDigits:d});function calc(){let c=n('sc')*1e6,t=n('st'),w=n('sw'),v=n('sv'),s=n('ss'),p=t/c*1000,T=p*w,m=v*1000-p,u=t*w,r=c*s-u;$('so').innerHTML=`<div class="big">${f(p)} µL cells + ${f(m)} µL media / well</div><b>${f(T)} µL</b> cells for ${w} wells<br><b>${f(v*w)} mL</b> total volume<br><b>${f(u,0)} cells</b> used<br><b>${f(r/1e6,3)} million</b> cells remaining`;let fc=n('fc'),fp=n('fp'),a=n('fa'),fm=n('fm'),q=Math.floor((fc+1e-10)/fp),left=fc-q*fp;$('fo').innerHTML=`<div class="big">${q} full vials</div><b>${f(q*fp)} million</b> cells used<br><b>${f(left,3)} million</b> remaining<br>Resuspend for aliquots in <b>${f(q*a,0)} µL</b><br>Each vial: <b>${a} µL cells + ${fm} µL freezing medium = ${a+fm} µL</b>`;let gc=n('gc')*1e6,gt=n('gt'),gw=n('gw'),gv=n('gv'),gm=n('gm')*1000,cc=gt/gv,cells=cc*gm,stock=cells/gc*1000,media=gm-stock;$('go').innerHTML=`<div class="big">${f(stock)} µL cells + ${f(media)} µL medium</div><b>${f(cells,0)} cells</b> in master mix<br><b>${f(gw*gv/1000,3)} mL</b> actually dispensed<br><b>${f(gt*gw,0)} cells</b> plated`;};document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['seed','freeze','gas'].forEach(x=>$(x).classList.add('hide'));$(b.dataset.x).classList.remove('hide')}));calc();</script></body></html>
